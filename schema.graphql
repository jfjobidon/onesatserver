}

# ─── Campaign results (settlement snapshot) ─────────────────────────────────
# These types are populated when a campaign transitions from `active` to
# `ended` by the status cron (see documentation/end-of-campaign-results.md).
# Read-only — the full snapshot is computed once and stored in
# Campaign.results (Json) for O(1) reads.

type PollOptionResults {
  id: String!
  title: String!
  sats: Int!
  votes: Int!
  satsPercent: Float!     # sats / poll.totalSats × 100, 1 decimal
  votesPercent: Float!    # votes / poll.totalVotes × 100, 1 decimal
  rank: Int!              # 1, 2, 3, … — ties get the same rank
}

type PollResults {
  id: String!
  title: String!
  totalSats: Int!
  totalVotes: Int!
  options: [PollOptionResults!]!
}

type CampaignResults {
  settledAt: DateScalar!
  endingDate: DateScalar!
  totalSats: Int!
  totalVotes: Int!
  totalUniqueVoters: Int!
  totalViews: Int!
  satsToAuthor: Int!      # floor(totalSats / 2) + 1
  satsToOSOV: Int!        # totalSats - satsToAuthor
  polls: [PollResults!]!
}

type CampaignSettledEvent {
  campaignId: String!
  settledAt: DateScalar!
}

type Query {
  placeholder: Boolean
  # REVIEW: campaignId Not null (String!) but must provide default value !!!
  # get list of all votes
  ping: pingResponse
  getLocalIpAddress: String!
  getVotesForCampaign(campaignId: String! = "", uid: String): getVotesQueryResponse
  getVotesForPoll(pollId: String! = "", uid: String): getVotesQueryResponse
  getVotesForPollOption(pollOptionId: String!): getVotesQueryResponse
  getVotesForUser(uid: String): getVotesQueryResponse
  getUserVotesForCampaign(campaignId: String!, uid: String): getVotesQueryResponse
  getUsers: [User]
  getUserById(id: String): User
  getUserName(uid: String): String
  getSatsBalance(uid: String!): Int
  getUserByUserName(userName: String): User
  getUserByEmail(email: String): User
  getPollOption(id: String): PollOption
  getCampaign(id: String): CampaignAll
  getCampaigns(uid: String, campaignType: CampaignType): [Campaign]
  # getCampaignsVoted(id: String): [Campaign]
  getCampaignsVoted(uid: String): getVotedQueryResponse
  getPoll(id: String): Poll
  getPollsForCampaign(campaignId: String): [Poll]
  getPollOptionsForPoll(pollId: String): [PollOption]
  getVoteById(id: String): Vote
  getFavorites(uid: String): getFavoritesQueryResponse
  getVoted(uid: String): getVotedQueryResponse
  # login(email: String!, password: String!): UserMutationResponse
  getCampaignResults(campaignId: String!): CampaignResults
}

# TODO: ajouter les types inputVote, inputCampaign, inputUser
type Mutation {
  createNewsEvent(title: String, description: String): NewsEvent
  createPoll(pollInput: PollInput): PollMutationResponse
  createPollOption(pollOptionInput: PollOptionInput): PollOptionMutationResponse
  addVote(voteInput: VoteInput): AddVoteMutationResponse
  signup(userInput: UserInput): UserMutationResponse
  createCampaign(campaignInput: CampaignInput): CampaignMutationResponse
  favoriteElement(favoriteInput: FavoriteInput): favoriteElementMutationResponse
  accountFunding(fundingInput: FundingInput): FundingMutationResponse
  togglePauseCampaign(pauseCampaignInput: PauseCampaignInput): pauseMutationResponse
  togglePausePoll(pausePollInput: PausePollInput): pauseMutationResponse
  publishCampaign(campaignId: String!): CampaignMutationResponse
}

type Subscription {
  newsFeed: NewsEvent
  voteAdded(campaignId: String!): Vote
  campaignSettled(campaignId: String!): CampaignSettledEvent
}
